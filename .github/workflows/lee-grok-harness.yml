name: Lee Grok harness

on:
  pull_request:
    paths:
      - ".github/workflows/lee-grok-harness.yml"
      - "lee-engineering/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lee-grok-harness.yml"
      - "lee-engineering/**"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s lee-engineering/tests -p 'test_*.py'
          node --test lee-engineering/tests/test_sync_grok_t3_connect.mjs
      - name: Validate entry points
        run: |
          python3 lee-engineering/scripts/sync_grok_harness.py digest --json
          sh -n lee-engineering/scripts/lee-grok
          sh -n lee-engineering/scripts/lee-grok-review
          sh -n lee-engineering/scripts/lee-cursor-grok
          node --check lee-engineering/scripts/sync_grok_t3_connect.mjs
